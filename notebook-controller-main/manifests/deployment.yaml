apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-controller
  namespace: notebook-controller-system
spec:
  selector:
    matchLabels:
      app: notebook-controller
  template:
    metadata:
      labels:
        app: notebook-controller
    spec:
      containers:
      - name: manager
        image: aispaceru/nb-c:latest
        imagePullPolicy: Always
        command:
          - /manager
        env:
          - name: USE_ISTIO
            valueFrom:
              configMapKeyRef:
                name: notebook-controller-config
                key: USE_ISTIO
          - name: ISTIO_GATEWAY
            valueFrom:
              configMapKeyRef:
                name: notebook-controller-config
                key: ISTIO_GATEWAY
          - name: CLUSTER_DOMAIN
            valueFrom:
              configMapKeyRef:
                name: notebook-controller-config
                key: CLUSTER_DOMAIN
          - name: CULL_IDLE_TIME
            valueFrom:
              configMapKeyRef:
                name: notebook-controller-config
                key: CULL_IDLE_TIME
          - name: ENABLE_CULLING
            valueFrom:
              configMapKeyRef:
                name: notebook-controller-config
                key: ENABLE_CULLING
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      serviceAccountName: notebook-controller-service-account
